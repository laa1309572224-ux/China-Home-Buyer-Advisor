<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>西安重庆购房监控台</title><style>
:root{--g:#176b4d;--gold:#d49b42;--ink:#15241f;--muted:#68756f}*{box-sizing:border-box}body{margin:0;background:#f4f2ec;color:var(--ink);font:14px/1.55 system-ui,"Microsoft YaHei",sans-serif}header{padding:32px 5vw 24px;background:linear-gradient(120deg,#123d30,#206b50);color:#fff}header h1{margin:0;font-size:clamp(26px,4vw,42px)}header p{color:#dbe9e2}.wrap{max-width:1320px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:15px}.card{background:#fff;border:1px solid #e7e3da;border-radius:14px;padding:18px;box-shadow:0 8px 24px #19271f0c}.toolbar{grid-column:span 12;display:flex;gap:10px;align-items:end;flex-wrap:wrap}.toolbar label{display:grid;color:var(--muted)}input,button{border:1px solid #d7d2c7;border-radius:8px;padding:9px 11px;font:inherit}button{background:var(--g);color:#fff;cursor:pointer}.city{background:#fff;color:var(--g);border-color:var(--g)}.city.active{background:var(--g);color:#fff}.kpi{grid-column:span 3}.kpi b{display:block;font-size:28px}.half{grid-column:span 6}.full{grid-column:span 12}.small{color:var(--muted);font-size:12px}.score{font-size:20px;font-weight:750;color:var(--g)}.bar{height:9px;background:#eee9df;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #eee9df;white-space:nowrap}th{color:var(--muted);font-size:12px}@media(max-width:850px){.kpi,.half{grid-column:span 12}.card{overflow:auto}}
</style></head><body><header><h1>西安 · 重庆购房监控台</h1><p>挂牌监控、成交对照、AI 选房参谋与贷款压力测算 · 公网独立运行</p></header><main class="wrap"><section class="grid">
<div class="card toolbar"><div><span class="small">城市</span><br><button class="city active" data-city="西安" onclick="switchCity('西安',this)">西安</button> <button class="city" data-city="重庆" onclick="switchCity('重庆',this)">重庆</button> <button class="city" data-city="全部" onclick="switchCity('全部',this)">全部</button></div><label>预算（万元）<input id="budget" type="number" value="250"></label><label>最长通勤（分钟）<input id="commute" type="number" value="45"></label><label>首付比例（%）<input id="down" type="number" value="30"></label><label>年利率（%）<input id="rate" type="number" step="0.01" value="3.1"></label><span style="flex:1"></span><button onclick="load()">刷新最新数据</button></div>
<div class="card kpi"><span class="small">监控房源</span><b id="count">—</b></div><div class="card kpi"><span class="small">预算内</span><b id="within">—</b></div><div class="card kpi"><span class="small">挂牌中位单价</span><b id="median">—</b></div><div class="card kpi"><span class="small">成交样本中位价</span><b id="dealMedian">—</b></div>
<div class="card half"><h3>AI 参谋评分</h3><div id="ranking"></div></div><div class="card half"><h3>决策意见</h3><div id="advice"></div></div><div class="card half"><h3>贷款压力</h3><div id="loan"></div><p class="small">等额本息 30 年，不含税费、中介费及组合贷。</p></div><div class="card half"><h3>成交价对照</h3><div id="deals"></div><p class="small">当前均为演示样本，真实决策前必须核验来源。</p></div>
<div class="card full"><h3>房源明细</h3><table><thead><tr><th>房源</th><th>区域</th><th>总价</th><th>单价</th><th>面积</th><th>评分</th></tr></thead><tbody id="rows"></tbody></table></div>
</section></main><script>
let raw=[],tx=[],city='西安';const f=n=>Number(n).toLocaleString('zh-CN'),e=s=>{const x=document.createElement('span');x.textContent=s??'';return x.innerHTML};
function scoring(x){const age=Math.max(new Date().getFullYear()-(x.year||new Date().getFullYear()),0),p={预算:Math.max(0,100-Math.max(x.total_price-budget.value,0)/Math.max(+budget.value,1)*160),通勤:Math.max(0,100-Math.max((x.commute_minutes||commute.value)-commute.value,0)*3),楼龄:Math.max(0,100-age*2),教育:+x.school_score||50,风险:100-(+x.risk_score||50)},s=Math.round((p.预算*.32+p.通勤*.26+p.楼龄*.14+p.教育*.14+p.风险*.14)*10)/10;return{...x,parts:p,score:s,decision:s>=80?'优先看房':s>=65?'保留比较':'谨慎考虑'}}
async function load(){const d=await fetch('./dashboard_data.json?ts='+Date.now()).then(r=>r.json());raw=d.listings;tx=d.transactions;render()}function switchCity(c,b){city=c;document.querySelectorAll('[data-city]').forEach(x=>x.classList.toggle('active',x===b));render()}
function render(){const data=raw.map(scoring).filter(x=>city==='全部'||x.city===city),t=tx.filter(x=>city==='全部'||x.city===city),mid=a=>a.length?a.sort((a,b)=>a-b)[Math.floor(a.length/2)]:null;count.textContent=data.length;within.textContent=data.filter(x=>x.total_price<=budget.value).length;median.textContent=mid(data.map(x=>x.unit_price))?f(mid(data.map(x=>x.unit_price)))+' 元':'—';dealMedian.textContent=mid(t.map(x=>x.unit_price))?f(mid(t.map(x=>x.unit_price)))+' 元':'—';const sorted=[...data].sort((a,b)=>b.score-a.score);ranking.innerHTML=sorted.map(x=>`<p><b>${e(x.community)}</b> <span class="score">${x.score}</span></p><div class="bar"><i style="width:${x.score}%"></i></div>`).join('');const top=sorted[0];advice.innerHTML=top?`<h2>${top.decision}：${e(top.community)}</h2><p>${e(top.city)} · ${e(top.district)} · 综合 ${top.score} 分</p><p>${Object.entries(top.parts).map(([k,v])=>`${k} ${v.toFixed(0)}`).join(' · ')}</p><p>先核验产权抵押、学区口径、噪声采光、维修记录和地质风险。</p>`:'暂无房源';if(top){const principal=top.total_price*10000*(1-down.value/100),m=rate.value/1200,n=360,pay=m?principal*m*(1+m)**n/((1+m)**n-1):principal/n;loan.innerHTML=`<h2>月供约 ${f(pay.toFixed(2))} 元</h2><p>首付 ${f((top.total_price*10000*down.value/100).toFixed(2))} 元 · 总利息 ${f((pay*n-principal).toFixed(2))} 元</p>`}deals.innerHTML=`<table><tbody>${t.map(x=>`<tr><td>${x.deal_date}</td><td>${e(x.community)}</td><td>${f(x.unit_price)} 元/㎡</td><td>${e(x.source)}</td></tr>`).join('')}</tbody></table>`;rows.innerHTML=sorted.map(x=>`<tr><td><b>${e(x.title)}</b><br><span class="small">${e(x.community)}</span></td><td>${e(x.city)} · ${e(x.district)}</td><td>${x.total_price} 万</td><td>${f(x.unit_price)} 元</td><td>${x.area} ㎡</td><td><span class="score">${x.score}</span> ${x.decision}</td></tr>`).join('')}
[budget,commute,down,rate].forEach(x=>x.onchange=render);load();
</script></body></html>
