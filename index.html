<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>中国购房决策助手</title><style>
:root{--ink:#15241f;--muted:#68756f;--paper:#f4f2ec;--card:#fff;--green:#176b4d;--gold:#d49b42;--red:#aa3e36}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 system-ui,"Microsoft YaHei",sans-serif}header{padding:34px max(5vw,24px) 26px;background:linear-gradient(120deg,#123d30,#206b50);color:white}header h1{margin:0;font-size:clamp(26px,4vw,44px)}header p{max-width:720px;color:#dbe9e2}.wrap{max-width:1280px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{background:var(--card);border:1px solid #e7e3da;border-radius:14px;padding:18px;box-shadow:0 8px 24px #19271f0c}.filters{grid-column:span 12;display:flex;gap:12px;flex-wrap:wrap}.filters label{display:grid;gap:4px;color:var(--muted)}input,button{border:1px solid #d7d2c7;border-radius:8px;padding:9px 11px;font:inherit}button{background:var(--green);color:#fff;border:0;cursor:pointer}.outline{background:#fff;color:var(--green);border:1px solid var(--green)}.kpi{grid-column:span 3}.kpi b{display:block;font-size:28px}.chart{grid-column:span 5}.side{grid-column:span 7}.bar{height:10px;background:#e9e6de;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #eee9df}th{color:var(--muted);font-size:12px}.score{font-size:20px;font-weight:750}.good{color:var(--green)}.warn{color:#9a651a}.bad{color:var(--red)}dialog{border:0;border-radius:14px;max-width:640px;width:90%;padding:22px}textarea{width:100%;min-height:160px}.small{color:var(--muted);font-size:12px}.empty{padding:34px;text-align:center;color:var(--muted)}@media(max-width:800px){.kpi,.chart,.side{grid-column:span 12}.card{overflow:auto}}
</style></head><body><header><h1>中国购房决策助手</h1><p>把房源、历史价格和个人偏好放到同一张决策桌上。评分可解释，数据留在本机，不替代法律、贷款和实地查验。</p></header>
<main class="wrap"><section class="grid">
<div class="card filters"><label>预算上限（万元）<input id="budget" type="number" value="350"></label><label>最长通勤（分钟）<input id="commute" type="number" value="45"></label><label>城市/区域筛选<input id="query" placeholder="例如：上海 浦东"></label><span style="flex:1"></span><button class="outline" onclick="openImport()">导入 JSON</button><button onclick="scoreAll()">重新评分</button></div>
<div class="card kpi"><span class="small">候选房源</span><b id="count">—</b></div><div class="card kpi"><span class="small">预算内</span><b id="within">—</b></div><div class="card kpi"><span class="small">最佳评分</span><b id="best">—</b></div><div class="card kpi"><span class="small">中位单价</span><b id="median">—</b></div>
<div class="card chart"><h3>评分排行</h3><div id="ranking"></div></div><div class="card side"><h3>购房决策提示</h3><div id="advice"></div></div>
<div class="card" style="grid-column:span 12"><h3>候选房源明细</h3><table><thead><tr><th>房源</th><th>区域</th><th>总价</th><th>单价</th><th>面积</th><th>历史</th><th>评分 / 结论</th></tr></thead><tbody id="rows"></tbody></table></div>
</section></main>
<dialog id="importDialog"><h2>导入房源 JSON</h2><p class="small">粘贴对象数组；必填 title、total_price（万元）、unit_price（元/㎡）、area（㎡）。重复 source_url 会更新并记录当天价格。</p><textarea id="jsonInput" placeholder='[{"title":"示例房源","total_price":320,"unit_price":42000,"area":76}]'></textarea><p><button onclick="importJson()">导入</button> <button class="outline" onclick="importDialog.close()">取消</button></p></dialog>
<script>
let all=[];const fmt=n=>Number(n).toLocaleString('zh-CN');const cls=n=>n>=80?'good':n>=65?'warn':'bad';
async function scoreAll(){const r=await fetch('/api/score',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({preferences:{budget:+budget.value,max_commute:+commute.value}})});all=await r.json();render()}
function render(){const q=query.value.trim().toLowerCase();const data=all.filter(x=>!q||[x.city,x.district,x.community,x.title].join(' ').toLowerCase().includes(q));count.textContent=data.length;within.textContent=data.filter(x=>x.total_price<=+budget.value).length;best.textContent=data.length?Math.max(...data.map(x=>x.score)).toFixed(1):'—';const prices=data.map(x=>x.unit_price).sort((a,b)=>a-b);median.textContent=prices.length?fmt(prices[Math.floor(prices.length/2)])+' 元':'—';
ranking.innerHTML=[...data].sort((a,b)=>b.score-a.score).slice(0,8).map(x=>`<p><b>${esc(x.community||x.title)}</b> <span class="score ${cls(x.score)}">${x.score}</span></p><div class="bar"><i style="width:${x.score}%"></i></div>`).join('')||'<div class="empty">暂无匹配房源</div>';
const top=[...data].sort((a,b)=>b.score-a.score)[0];advice.innerHTML=top?`<h2>${esc(top.decision)}：${esc(top.community||top.title)}</h2><p>综合 ${top.score} 分。${Object.entries(top.parts).map(([k,v])=>`${k} ${v}`).join(' · ')}</p><p class="small">下一步：核验产权与抵押、噪声采光、物业维修记录、学区政策和真实通勤；历史价格只是议价参考。</p>`:'<div class="empty">调整筛选或导入房源后生成建议</div>';
rows.innerHTML=data.sort((a,b)=>b.score-a.score).map(x=>`<tr><td><b>${esc(x.title)}</b><br><span class="small">${esc(x.community||'')}</span></td><td>${esc([x.city,x.district].filter(Boolean).join(' · ')||'—')}</td><td>${fmt(x.total_price)} 万</td><td>${fmt(x.unit_price)} 元</td><td>${x.area} ㎡</td><td>${x.history?.length||1} 次</td><td><span class="score ${cls(x.score)}">${x.score}</span><br>${x.decision}</td></tr>`).join('')}
function esc(s){const e=document.createElement('span');e.textContent=s??'';return e.innerHTML}function openImport(){importDialog.showModal()}async function importJson(){try{const body=JSON.parse(jsonInput.value);const r=await fetch('/api/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const out=await r.json();if(!r.ok)throw Error(out.error);importDialog.close();scoreAll()}catch(e){alert(e.message)}}query.oninput=render;budget.onchange=scoreAll;commute.onchange=scoreAll;scoreAll();
</script></body></html>
